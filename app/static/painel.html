<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espelho-live</title>
<style>
  :root { --fundo:#14161f; --cartao:#1e2130; --borda:#363b52; --texto:#e8e9f0; --fraco:#a7abc0;
          --azul:#5b6cff; --verde:#35c98a; --ambar:#f0b441; --vermelho:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font-family:system-ui, "Segoe UI", sans-serif; font-size:15px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid var(--borda); }
  header h1 { font-size:18px; margin:0; }
  main { max-width:980px; margin:0 auto; padding:24px 16px 60px; display:grid; gap:20px; }
  section { background:var(--cartao); border-radius:12px; padding:20px; }
  h2 { font-size:15px; margin:0 0 14px; color:var(--fraco); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; font-size:13px; color:var(--fraco); margin-bottom:4px; }
  input, select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--borda); background:var(--fundo); color:inherit; font-size:14px; }
  button { padding:9px 16px; border:0; border-radius:8px; background:var(--azul); color:#fff; font-size:14px; cursor:pointer; }
  button.sec { background:transparent; border:1px solid var(--borda); color:var(--texto); }
  button.perigo { background:var(--vermelho); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .grade { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); align-items:end; }
  .estado { display:flex; align-items:center; gap:12px; font-size:22px; font-weight:600; }
  .bola { width:14px; height:14px; border-radius:50%; background:var(--fraco); flex:none; }
  .bola.ao_vivo { background:var(--verde); } .bola.espera, .bola.conectando { background:var(--ambar); }
  .detalhes { color:var(--fraco); margin:8px 0 16px; font-size:14px; }
  .aviso { background:#3a2226; border:1px solid var(--vermelho); border-radius:10px; padding:14px; display:flex; gap:12px; justify-content:space-between; align-items:flex-start; }
  .aviso small { display:block; color:var(--fraco); margin-top:6px; word-break:break-word; }
  .chamada { background:#1d3329; border:1px solid var(--verde); border-radius:10px; padding:12px 14px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--borda); }
  th { color:var(--fraco); font-weight:500; font-size:12px; }
  td.acoes { white-space:nowrap; text-align:right; }
  td.acoes button { padding:5px 10px; font-size:13px; margin-left:4px; }
  .selo { font-size:12px; padding:2px 8px; border-radius:10px; background:#2b3047; }
  .selo.ok { background:#1d3329; color:var(--verde); } .selo.nao { background:#3a2226; color:var(--vermelho); }
  .selo.live { background:var(--verde); color:#06281a; font-weight:600; }
  .rolagem { overflow-x:auto; }
  .linha { display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap; }
  .erro { color:var(--vermelho); font-size:13px; min-height:18px; margin-top:8px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>espelho-live</h1>
  <button class="sec" id="sair">Sair</button>
</header>
<main>
  <div class="aviso" id="aviso" hidden>
    <div><strong id="avisoTexto"></strong><small id="avisoDetalhe"></small></div>
    <button class="sec" id="avisoOk">Entendi</button>
  </div>
  <div class="chamada" id="chamada" hidden></div>

  <section>
    <h2>Retransmissão</h2>
    <div class="estado"><span class="bola" id="bola"></span><span id="estadoTexto">Carregando…</span></div>
    <div class="detalhes" id="detalhes"></div>

    <form id="formInicio">
      <div class="grade">
        <div><label for="criador">Criador</label><select id="criador" required></select></div>
        <div><label for="url">URL da Shopee (RTMP)</label><input id="url" placeholder="rtmp://…" autocomplete="off" required></div>
        <div><label for="chave">Chave da transmissão</label><input id="chave" type="password" autocomplete="off"></div>
        <div><button id="btnIniciar">Iniciar retransmissão</button></div>
      </div>
      <div class="erro" id="erroInicio"></div>
    </form>
    <button class="perigo" id="btnParar" hidden>Parar retransmissão</button>
  </section>

  <section>
    <div class="linha">
      <h2 style="margin:0">Detecção automática de lives</h2>
      <label style="margin:0; display:flex; gap:8px; align-items:center; color:var(--texto)">
        <input type="checkbox" id="deteccao" style="width:auto"> Ativada
      </label>
    </div>
    <div class="detalhes" id="deteccaoInfo" style="margin-bottom:0"></div>
  </section>

  <section>
    <h2>Criadores autorizados</h2>
    <div class="rolagem">
      <table>
        <thead><tr><th>Nome</th><th>Usuário no TikTok</th><th>Termo válido até</th><th>Situação</th><th></th></tr></thead>
        <tbody id="tabCriadores"></tbody>
      </table>
    </div>
    <form id="formCriador" style="margin-top:16px">
      <input type="hidden" id="cId">
      <div class="grade">
        <div><label for="cNome">Nome</label><input id="cNome" required></div>
        <div><label for="cUsuario">Usuário no TikTok</label><input id="cUsuario" placeholder="@usuario" required></div>
        <div><label for="cTermo">Termo válido até</label><input id="cTermo" type="date" required></div>
        <div><label style="display:flex; gap:8px; align-items:center; color:var(--texto)"><input type="checkbox" id="cAtivo" checked style="width:auto"> Ativo</label></div>
        <div style="display:flex; gap:8px"><button id="cSalvar">Adicionar</button><button type="button" class="sec" id="cCancelar" hidden>Cancelar</button></div>
      </div>
      <div class="erro" id="erroCriador"></div>
    </form>
  </section>

  <section>
    <h2>Registro de sessões</h2>
    <div class="rolagem">
      <table>
        <thead><tr><th>Criador</th><th>Início</th><th>Fim</th><th>Duração</th><th>Quedas</th><th>Em espera</th><th>Resultado</th></tr></thead>
        <tbody id="tabSessoes"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, filhos = []) => {
  const n = Object.assign(document.createElement(tag), props);
  filhos.forEach((f) => n.append(f));
  return n;
};
let criadores = [];
let assinaturaCriadores = '', assinaturaSessoes = '';

async function api(caminho, metodo = 'GET', corpo) {
  const r = await fetch(caminho, {method: metodo,
    headers: corpo ? {'Content-Type': 'application/json'} : {},
    body: corpo ? JSON.stringify(corpo) : undefined});
  if (r.status === 401) { location.href = '/login'; throw new Error('sessão expirada'); }
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = dados.detail;
    throw new Error(typeof d === 'string' ? d : 'Não foi possível concluir. Confira os campos.');
  }
  return dados;
}

const dur = (s) => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return (h ? h + 'h ' : '') + (h || m ? m + 'min ' : '') + x + 's';
};
const dataHora = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', {dateStyle: 'short', timeStyle: 'short'}) : '—';
const dataBr = (iso) => iso.split('-').reverse().join('/');

const NOMES = {parado: 'Parado', conectando: 'Conectando à live…', ao_vivo: 'Retransmitindo ao vivo', espera: 'Tela de espera no ar'};

function desenhar(e) {
  const r = e.retransmissao, ativo = r.estado !== 'parado';
  $('bola').className = 'bola ' + r.estado;
  $('estadoTexto').textContent = NOMES[r.estado] || r.estado;
  let d = '';
  if (ativo && r.criador) {
    d = `${r.criador.nome} (@${r.criador.usuario}) · no ar há ${dur(Date.now() / 1000 - r.inicio)} · ${r.quedas} queda(s) · ${dur(r.segundos_espera)} em espera`;
    if (r.estado === 'espera') d += ` · encerra em ${dur(r.espera_max - r.espera_atual)} se a live não voltar`;
  }
  $('detalhes').textContent = d;
  $('formInicio').hidden = ativo;
  $('btnParar').hidden = !ativo;

  $('aviso').hidden = !r.aviso;
  if (r.aviso) { $('avisoTexto').textContent = r.aviso.texto; $('avisoDetalhe').textContent = r.aviso.detalhe || ''; }

  const det = e.deteccao;
  $('deteccao').checked = det.ativa;
  const aoVivo = new Set(det.ao_vivo);
  $('deteccaoInfo').textContent = !det.ativa ? 'Desativada. Nenhum perfil é consultado.'
    : det.ultima_verificacao ? 'Última verificação: ' + new Date(det.ultima_verificacao * 1000).toLocaleTimeString('pt-BR')
    : 'Aguardando a primeira verificação…';
  const nomesAoVivo = e.criadores.filter((c) => aoVivo.has(c.usuario)).map((c) => `${c.nome} (@${c.usuario})`);
  $('chamada').hidden = !nomesAoVivo.length || ativo;
  $('chamada').textContent = 'Ao vivo agora no TikTok: ' + nomesAoVivo.join(', ') + '. Crie a live na Shopee e inicie a retransmissão.';

  criadores = e.criadores;
  const ass = JSON.stringify([e.criadores, det.ao_vivo]);
  if (ass !== assinaturaCriadores) {
    assinaturaCriadores = ass;
    const sel = $('criador'), atual = sel.value;
    sel.replaceChildren(el('option', {value: '', textContent: 'Selecione…'}),
      ...e.criadores.filter((c) => c.autorizado).map((c) =>
        el('option', {value: c.id, textContent: `${c.nome} (@${c.usuario})` + (aoVivo.has(c.usuario) ? ' — ao vivo' : '')})));
    sel.value = atual;
    $('tabCriadores').replaceChildren(...(e.criadores.length ? e.criadores.map((c) => {
      const sit = !c.ativo ? ['Desativado', 'nao'] : !c.termo_valido ? ['Termo vencido', 'nao'] : ['Autorizado', 'ok'];
      const selos = [el('span', {className: 'selo ' + sit[1], textContent: sit[0]})];
      if (aoVivo.has(c.usuario)) selos.push(' ', el('span', {className: 'selo live', textContent: 'AO VIVO'}));
      return el('tr', {}, [
        el('td', {textContent: c.nome}), el('td', {textContent: '@' + c.usuario}),
        el('td', {textContent: dataBr(c.termo_validade)}), el('td', {}, selos),
        el('td', {className: 'acoes'}, [
          el('button', {className: 'sec', textContent: 'Editar', onclick: () => editar(c)}),
          el('button', {className: 'sec', textContent: 'Remover', onclick: () => remover(c)})])]);
    }) : [el('tr', {}, [el('td', {colSpan: 5, textContent: 'Nenhum criador cadastrado. Adicione abaixo quem já assinou o termo.'})])]));
  }

  const assS = JSON.stringify(e.sessoes);
  if (assS !== assinaturaSessoes) {
    assinaturaSessoes = assS;
    $('tabSessoes').replaceChildren(...(e.sessoes.length ? e.sessoes.map((s) => el('tr', {}, [
      el('td', {textContent: `${s.nome} (@${s.usuario})`}), el('td', {textContent: dataHora(s.inicio)}),
      el('td', {textContent: dataHora(s.fim)}),
      el('td', {textContent: s.fim ? dur((new Date(s.fim) - new Date(s.inicio)) / 1000) : 'em andamento'}),
      el('td', {textContent: s.quedas}), el('td', {textContent: dur(s.segundos_espera)}),
      el('td', {textContent: s.resultado || '—'})]))
      : [el('tr', {}, [el('td', {colSpan: 7, textContent: 'Nenhuma sessão registrada ainda.'})])]));
  }
}

async function atualizar() {
  try { desenhar(await api('/api/estado')); }
  catch (e) { $('estadoTexto').textContent = 'Sem contato com o servidor'; $('bola').className = 'bola'; }
}

$('formInicio').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('erroInicio').textContent = '';
  $('btnIniciar').disabled = true;
  try {
    await api('/api/iniciar', 'POST', {criador_id: Number($('criador').value), url: $('url').value, chave: $('chave').value});
    $('url').value = ''; $('chave').value = '';
  } catch (e) { $('erroInicio').textContent = e.message; }
  $('btnIniciar').disabled = false;
  atualizar();
});

$('btnParar').addEventListener('click', async () => {
  if (!confirm('Parar a retransmissão agora? Lembre-se de encerrar também a live na Shopee.')) return;
  $('btnParar').disabled = true;
  try { await api('/api/parar', 'POST'); } catch (e) {}
  $('btnParar').disabled = false;
  atualizar();
});

$('avisoOk').addEventListener('click', async () => { await api('/api/aviso/dispensar', 'POST'); atualizar(); });
$('deteccao').addEventListener('change', async (ev) => { await api('/api/deteccao', 'POST', {ativa: ev.target.checked}); atualizar(); });
$('sair').addEventListener('click', async () => { await api('/api/sair', 'POST'); location.href = '/login'; });

function limparFormCriador() {
  $('formCriador').reset(); $('cId').value = ''; $('cAtivo').checked = true;
  $('cSalvar').textContent = 'Adicionar'; $('cCancelar').hidden = true; $('erroCriador').textContent = '';
}
function editar(c) {
  $('cId').value = c.id; $('cNome').value = c.nome; $('cUsuario').value = c.usuario;
  $('cTermo').value = c.termo_validade; $('cAtivo').checked = c.ativo;
  $('cSalvar').textContent = 'Salvar alterações'; $('cCancelar').hidden = false; $('cNome').focus();
}
async function remover(c) {
  if (!confirm(`Remover ${c.nome} (@${c.usuario}) da lista de autorizados?`)) return;
  try { await api('/api/criadores/' + c.id, 'DELETE'); } catch (e) { alert(e.message); }
  atualizar();
}
$('cCancelar').addEventListener('click', limparFormCriador);
$('formCriador').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const id = $('cId').value;
  const corpo = {nome: $('cNome').value, usuario: $('cUsuario').value, termo_validade: $('cTermo').value, ativo: $('cAtivo').checked};
  try {
    await api(id ? '/api/criadores/' + id : '/api/criadores', id ? 'PUT' : 'POST', corpo);
    limparFormCriador();
  } catch (e) { $('erroCriador').textContent = e.message; }
  atualizar();
});

atualizar();
setInterval(atualizar, 3000);
</script>
</body>
</html>
