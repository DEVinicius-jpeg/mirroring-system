<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espelho-live</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#14161f; color:#e8e9f0;
         font-family:system-ui, "Segoe UI", sans-serif; }
  form { background:#1e2130; padding:32px; border-radius:12px; width:min(320px, 90vw); }
  h1 { font-size:20px; margin:0 0 20px; }
  label { font-size:13px; color:#a7abc0; }
  input { width:100%; box-sizing:border-box; margin:6px 0 16px; padding:10px; border-radius:8px;
          border:1px solid #363b52; background:#14161f; color:inherit; font-size:15px; }
  button { width:100%; padding:10px; border:0; border-radius:8px; background:#5b6cff; color:#fff;
           font-size:15px; cursor:pointer; }
  #erro { color:#ff8080; font-size:13px; min-height:18px; margin-top:12px; }
</style>
</head>
<body>
<form id="f">
  <h1>espelho-live</h1>
  <label for="senha">Senha do painel</label>
  <input id="senha" type="password" autocomplete="current-password" autofocus required>
  <button>Entrar</button>
  <div id="erro"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({senha: document.getElementById('senha').value})});
  if (r.ok) location.href = '/';
  else document.getElementById('erro').textContent = (await r.json()).detail || 'Não foi possível entrar.';
});
</script>
</body>
</html>
